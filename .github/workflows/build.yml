name: Build Virtual Filesystem

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate VFS (fs.json)
        run: |
          python build.py

      - name: Commit and Push fs.json if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update fs.json [skip ci]" && git push)